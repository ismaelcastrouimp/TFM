[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "tfm"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "jax",
    "flax",
    "netket",
    "optax",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src_renyi*"]

[tool.setuptools.package-dir]
"" = "."