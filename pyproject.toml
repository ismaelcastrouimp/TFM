[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "tfm"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "jax[cuda13]==0.10.0; sys_platform == 'linux'",
    "jaxlib==0.10.0",
    "flax",
    "netket>=3.13",
    "optax",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src_renyi*"]

[tool.setuptools.package-dir]
"" = "."